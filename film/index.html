<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>종이 한 장</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ece9e1;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* Each sheet lies on top of the next one; a tear in the upper sheet reveals the lower. */
      #s1-hanji { z-index: 4; }
      #s2-kraft { z-index: 3; }
      #s3-news { z-index: 2; }
      #s4-poster { z-index: 1; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-j7pz" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-d2bc" id="s1-hanji" data-composition-id="s1-hanji" data-composition-src="compositions/s1-hanji.html" data-start="0" data-duration="9.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-ybqr" id="s2-kraft" data-composition-id="s2-kraft" data-composition-src="compositions/s2-kraft.html" data-start="8.7" data-duration="6.8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-z475" id="s3-news" data-composition-id="s3-news" data-composition-src="compositions/s3-news.html" data-start="14.3" data-duration="6.8" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-66sa" id="s4-poster" data-composition-id="s4-poster" data-composition-src="compositions/s4-poster.html" data-start="19.9" data-duration="10.1" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio data-hf-id="hf-3cjc" id="score" class="clip" src="assets/audio/score.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 30 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
